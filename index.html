<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danwave</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10161f;
        color: #f4f1e8;
        font-family: "Courier New", Courier, monospace;
      }
      main { padding: 16px; text-align: center; }
      h1 { color: #ffe36b; letter-spacing: 0.08em; }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 18px;
        border: 1px solid #ffe36b;
        border-radius: 6px;
        color: #ffe36b;
        text-decoration: none;
      }
      a:hover { background: #ffe36b; color: #10161f; }
      nav { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>DANWAVE</h1>
      <p>Juegos y proyectos.</p>
      <nav>
        <a href="wingover/">Wingover — combate aéreo retro</a>
        <a href="roomies/">Roomies — simulador de vida isométrico</a>
      </nav>
    </main>
  </body>
</html>
